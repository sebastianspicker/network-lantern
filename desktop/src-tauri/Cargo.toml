[package]
name = "network-lantern-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
[build-dependencies]
tauri-build = { version = "2.5", features = [] }
[dependencies]
tauri = { version = "2.10", features = [] }
lantern-runtime = { path = "../../crates/runtime" }
lantern-contracts = { path = "../../crates/contracts" }
serde_json.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tauri-plugin-wdio = { version = "1", optional = true }
tauri-plugin-wdio-webdriver = { version = "1", optional = true }
[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
e2e = ["dep:tauri-plugin-wdio", "dep:tauri-plugin-wdio-webdriver"]
