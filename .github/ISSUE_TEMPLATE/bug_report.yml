name: Bug report
description: Report a problem with Network Lantern
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Do not include credentials, private hostnames, internal IP addresses,
        raw route traces, or unsanitized logs.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: Describe the failure and its effect.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Provide the minimal commands and inputs needed to reproduce it.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: Describe the expected result.
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Describe the observed result, including the exit code if relevant.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Provide only sanitized, non-sensitive environment details.
      value: |
        - OS:
        - Network Lantern version (`cat VERSION`, `network-lantern --version`):
        - Tool used (Rust CLI, desktop, PowerShell or Bash tool) and its component version:
        - PowerShell version (pwsh -v), if relevant:
        - `network-lantern doctor --json` output, if using the Rust CLI:
        - NIC model/driver (if relevant):
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Safety checks
      options:
        - label: I ran with `-DryRun` first (if applicable).
          required: false
        - label: I checked the automatic backup validation result for a real tuning Apply (if applicable).
          required: false
