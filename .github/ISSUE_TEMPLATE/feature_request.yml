name: Feature request
description: Suggest an enhancement or new Network Lantern capability
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Do not include credentials, private hostnames, internal IP addresses,
        raw route traces, or unsanitized logs.
  - type: textarea
    id: problem
    attributes:
      label: Problem statement
      description: Describe the operator problem or current limitation.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the proposed behavior and affected workflow.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: List workarounds or alternative designs considered.
    validations:
      required: false
  - type: textarea
    id: context
    attributes:
      label: Context
      description: Add sanitized measurements or constraints that affect the proposal.
    validations:
      required: false
