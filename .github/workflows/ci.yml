name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# The module pins are owned by $requiredModules in scripts/ci.ps1 (and mirrored in
# scripts/Test-Prerequisites.ps1). Keep the cache key below in sync with them.
# PSScriptAnalyzer: 1.24.0
# Update the cache key suffix below whenever these versions change.

jobs:
  path-lint-test:
    name: Path lint and tests
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.user.login == 'dependabot[bot]')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Cache PowerShell modules
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.local/share/powershell/Modules
          key: psmodules-${{ runner.os }}-pssa-1.24.0

      - name: Run legacy behavior gate
        env:
          NETWORK_LANTERN_INSTALL_MISSING_MODULES: "1"
        run: ./scripts/ci-legacy.sh

  powershell-lint-test:
    name: PowerShell checks (${{ matrix.os }})
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.user.login == 'dependabot[bot]')
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            modulePath: C:\Users\runneradmin\Documents\PowerShell\Modules
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Cache PowerShell modules
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ matrix.modulePath }}
          key: psmodules-${{ runner.os }}-pssa-1.24.0

      - name: Secret scan
        shell: pwsh -NoProfile -NonInteractive -Command "{0}"
        run: |
          ./scripts/Invoke-SecretScan.ps1

      - name: Run PowerShell checks
        shell: pwsh -NoProfile -NonInteractive -Command "{0}"
        run: |
          ./scripts/ci.ps1
