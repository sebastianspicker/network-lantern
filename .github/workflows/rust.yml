name: Rust migration
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions: {}
jobs:
  native:
    name: Rust and desktop (${{ matrix.os }})
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.user.login == 'dependabot[bot]')
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      MACOSX_DEPLOYMENT_TARGET: '13.0'
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-15-intel, macos-15]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Linux desktop prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Desktop dependencies
        working-directory: desktop
        run: npm ci
      - name: Desktop checks
        working-directory: desktop
        run: npm run check
      - name: Desktop build
        working-directory: desktop
        run: npm run build
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Rust tests
        run: cargo test --workspace --locked
      - name: CLI release build
        run: cargo build --release --locked -p network-lantern
      - name: CLI pure preview
        run: cargo run --locked -p network-lantern -- throughput --target fixture.invalid --dry-run --json
      - name: Native host build
        run: cargo build --release --locked -p network-lantern-desktop -p lantern-helper
      - name: Secret scan
        shell: pwsh
        run: ./scripts/Invoke-SecretScan.ps1
