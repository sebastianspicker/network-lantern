[workspace]
resolver = "3"
members = ["crates/contracts", "crates/platform", "crates/runtime", "crates/cli", "crates/throughput", "crates/path-basic", "crates/path-trace", "crates/path-io", "crates/packet", "crates/tuning", "crates/helper", "desktop/src-tauri"]
default-members = ["crates/cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
license = "MIT"

[workspace.dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tokio = { version = "1.49.0", features = ["full"] }
tokio-util = { version = "0.7.18", features = ["rt"] }
thiserror = "2.0.18"
libc = "0.2.180"
rand = "0.9.2"
socket2 = { version = "0.6.2", features = ["all"] }
clap = { version = "4.5.57", features = ["derive"] }
uuid = { version = "1.20.0", features = ["v4", "serde"] }
chrono = { version = "0.4.43", default-features = false, features = ["clock", "serde"] }
tempfile = "3.25.0"
sha2 = "0.10.9"

csv = "1.4.0"
quick-xml = "0.38.4"
windows-sys = "0.61.2"
zbus = { version = "5.13", default-features = false, features = ["tokio"] }
objc2 = "0.6.4"
objc2-foundation = "0.3.2"
objc2-service-management = "0.3.2"
block2 = "0.6.2"
